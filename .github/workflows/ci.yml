# The constitution's first two quality gates, automated.
#
# The development workflow says: "1. `flutter analyze` with no new errors or warnings.
# 2. `flutter test` green". Until now that only happened when someone remembered to run
# it on their own machine, and on a branch of 262 files heading for `main` that means
# nothing stops a broken merge.
#
# The third job — building for web — is not there out of habit. This project has broken
# twice in ways that only appear on that target and that `flutter test` cannot see,
# because the tests run on the Dart VM:
#
#   * an import of `package:drift/native.dart` pulling in `dart:ffi`, which does not
#     exist on the web;
#   * a plugin registry reused from a build older than a dependency, which shipped and
#     left the deployed app without `shared_preferences`, in silence.
#
# So this builds the same way the deploy script does, and checks the generated registry
# the same way too.

name: CI

on:
  # `push` only on `main`; working branches are covered by their pull request. With
  # `push` on every branch, each push to a branch with an open PR started **two**
  # identical runs — visible on the very first one. Spending twice the minutes to learn
  # the same thing twice is not useful redundancy.
  push:
    branches: [main]
  pull_request:

# If two pushes land in a row, the first run is already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the project uses. Pinning is deliberate: "latest stable" turns an
  # upstream release into a CI failure nobody caused, and the constitution pins the SDK
  # in `pubspec.yaml`.
  #
  # The runner image is pinned for the same reason: GitHub warned on the first run that
  # `ubuntu-latest` becomes Ubuntu 26 on 19 October. CI that turns red on its own, in
  # the week the app is being verified, costs more to explain than a version bump costs
  # to make.
  FLUTTER_VERSION: '3.44.2'

jobs:
  quality:
    name: analyze and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The database tests open a real sqlite with `NativeDatabase.memory()`, so they
      # need the system library. The image usually ships it; asking for it explicitly
      # removes the "usually".
      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      # Fails on any warning, not just on errors: that is what Principle V asks for.
      - run: flutter analyze

      - run: flutter test

  web:
    name: web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # `--no-web-resources-cdn` serves canvaskit from our own domain, which is what
      # makes it cacheable for offline use. Built the same way it is published: a CI
      # build that does not resemble the production one proves nothing about production.
      - name: Build
        run: >
          flutter build web --release --no-web-resources-cdn
          --dart-define=BUILD_ID=ci-${{ github.sha }}

      # The check that was missing the day a bundle shipped without
      # `shared_preferences`: every plugin the project declares for web has to appear in
      # the registry **this** build generated.
      - name: Check the web plugin registry
        run: |
          registrant=$(find .dart_tool/flutter_build -name web_plugin_registrant.dart | head -1)
          if [ -z "$registrant" ]; then
            echo "The build did not generate web_plugin_registrant.dart"
            exit 1
          fi
          echo "Registry: $registrant"
          missing=0
          for plugin in $(jq -r '.plugins.web[].name' .flutter-plugins-dependencies); do
            if grep -q "package:$plugin/" "$registrant"; then
              echo "  ok       $plugin"
            else
              echo "  MISSING  $plugin"
              missing=1
            fi
          done
          exit $missing
